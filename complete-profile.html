<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finish Setting Up — LabRelay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="LabRelay connects researchers who need help with small tasks — literature reviews, data entry, survey outreach — with students who want real experience.">
<meta property="og:title" content="Finish Setting Up — LabRelay">
<meta property="og:description" content="LabRelay connects researchers who need help with small tasks — literature reviews, data entry, survey outreach — with students who want real experience.">
<meta property="og:image" content="https://thebravebasil.github.io/labrelay/og-image.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thebravebasil.github.io/labrelay/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">LabRelay</span>
      <span class="brand-no">student-built</span>
    </a>
    <nav class="links">
      <a href="board.html">Browse Tasks</a>
      <a href="post.html">Post a Task</a>
      <a href="my-tasks.html">My Tasks</a>
      <a href="my-applications.html">My Applications</a>
      <a href="devlog.html">Dev Log</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</header>

<section class="auth">
  <div class="wrap">
    <form class="auth-form" id="profileForm">
      <h2>One last thing</h2>
      <p class="auth-sub">How will you be using LabRelay?</p>
      <div class="field">
        <label>I am a</label>
        <div class="radio-row">
          <label><input type="radio" name="role" value="Student" checked> Student</label>
          <label><input type="radio" name="role" value="Researcher"> Researcher / Doctor</label>
        </div>
      </div>
      <button class="btn btn-amber" type="submit" style="width:100%; justify-content:center;">Continue</button>
    </form>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>LabRelay — a research task exchange · v1</span>
  </div>
</footer>

<script type="module">
  import { auth, db, initNavAuth } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  initNavAuth();

  onAuthStateChanged(auth, async (user) => {
    if (!user){
      window.location.href = "login.html";
      return;
    }
    // If they already have a profile, no need to be here.
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()){
      window.location.href = "index.html";
    }
  });

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;
    const role = document.querySelector('input[name="role"]:checked').value;

    await setDoc(doc(db, "users", user.uid), {
      name: user.displayName || user.email,
      email: user.email,
      role,
      createdAt: serverTimestamp()
    });

    window.location.href = "index.html";
  });
</script>
</body>
</html>
